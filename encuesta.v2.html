<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encuesta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #2d7a4f;
      --green-light: #e8f5ee;
      --green-mid:   #4aaa74;
      --text:        #1a1a1a;
      --muted:       #6b7280;
      --white:       #ffffff;
      --radius:      14px;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--green-light);
      color: var(--text);
    }

    /* ── barra superior ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 28px;
      background: var(--white);
      border-bottom: 1px solid #d1e8da;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: var(--green);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .brand {
      font-family: 'Fraunces', serif;
      font-size: 1.15rem;
      color: var(--green);
      letter-spacing: -0.3px;
    }

    /* ── principal ── */
    main {
      min-height: calc(100vh - 65px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    .survey-card {
      width: 100%;
      max-width: 720px;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(45,122,79,0.10);
      overflow: hidden;
      animation: fadeUp .45s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      background: var(--green);
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-header svg { width: 22px; height: 22px; fill: none; stroke: rgba(255,255,255,.85); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .card-header span { color: rgba(255,255,255,.92); font-size: .92rem; font-weight: 500; }

    /* SurveyMonkey iframe container */
    .survey-embed {
      width: 100%;
      min-height: 520px;
    }

    .survey-embed iframe {
      width: 100%;
      min-height: 520px;
      border: none;
      display: block;
    }

    /* Marcador de posición mientras no se haya configurado ningún iframe */
    .survey-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 380px;
      padding: 40px;
      text-align: center;
    }
    .survey-placeholder svg { width: 52px; height: 52px; stroke: var(--green-mid); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .survey-placeholder p { color: var(--muted); font-size: .95rem; line-height: 1.55; max-width: 340px; }
    .survey-placeholder code { background: var(--green-light); color: var(--green); padding: 2px 8px; border-radius: 5px; font-size: .85rem; }

    /* ── FOOTER ── */
    footer {
      margin-top: 28px;
      text-align: center;
      font-size: .78rem;
      color: var(--muted);
    }
  </style>

</head>
<body>

  <header>
    <div class="logo-icon">
      <!-- clipboard icon -->
      <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
    </div>
    <span class="brand">Encuesta</span>
  </header>

  <main>
    <div class="survey-card">

      <div class="card-header">
        <!-- clock / time icon -->
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span>Completar esta encuesta toma menos de 3 minutos</span>
      </div>

      <div class="survey-embed">
        <!--
          ═══════════════════════════════════════════════
           Reemplazá el bloque de abajo con el
          snippet de "Encuesta insertada" de SurveyMonkey
          ═══════════════════════════════════════════════
        -->
        <div class="survey-placeholder">
          <!-- form icon -->
          
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
          <p>Aquí va el iframe de SurveyMonkey.<br/>
          <code>Encuesta insertada</code> </p>
        </div>
      </div>

    </div>

    <footer>Tu privacidad está protegida · Respuestas anónimas</footer>
  </main>

</body>
</html>
